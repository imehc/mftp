name: Release packages

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-info:
    name: Release info
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release-info.outputs.version }}
      should_release: ${{ steps.release-info.outputs.should_release }}
      release_body: ${{ steps.release-info.outputs.release_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate release notes
        id: release-info
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            {
              echo "version=${VERSION}"
              echo "should_release=false"
              echo "release_body<<EOF"
              echo "Version v${VERSION} already exists. Release build skipped."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_TAG="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1 || true)"

          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..HEAD"
            HEADER="Changes since ${PREVIOUS_TAG}"
          else
            RANGE="HEAD"
            HEADER="Initial release"
          fi

          NOTES="$(git log "$RANGE" --pretty=format:'- %s (%h)' --no-merges)"
          if [ -z "$NOTES" ]; then
            NOTES="- No code changes since ${PREVIOUS_TAG}."
          fi

          {
            echo "version=${VERSION}"
            echo "should_release=true"
            echo "release_body<<EOF"
            echo "${HEADER}"
            echo
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test and build
    needs: release-info
    if: needs.release-info.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version consistency
        run: pnpm run version:check

      - name: Build frontend
        run: pnpm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  build:
    name: Build ${{ matrix.platform }}
    needs: [release-info, test]
    if: needs.release-info.outputs.should_release == 'true'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --bundles app,dmg
          - platform: windows-latest
            args: --bundles nsis,msi
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version consistency
        run: pnpm run version:check

      - name: Check updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is required to build signed updater artifacts."
            exit 1
          fi

      - name: Build and upload Tauri package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: mftp v__VERSION__
          releaseBody: ${{ needs.release-info.outputs.release_body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  publish:
    name: Publish release
    needs: [release-info, build]
    if: needs.release-info.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-info.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/mftp-release
          gh release download "v${VERSION}" \
            --pattern latest.json \
            --dir /tmp/mftp-release \
            --clobber

          node <<'NODE'
          const fs = require("fs");

          const manifest = JSON.parse(
            fs.readFileSync("/tmp/mftp-release/latest.json", "utf8"),
          );
          const platforms = manifest.platforms ?? {};
          const platformKeys = Object.keys(platforms);
          const required = [
            {
              name: "macOS Apple Silicon",
              keys: ["darwin-aarch64-app", "darwin-aarch64"],
            },
            {
              name: "Windows x64",
              keys: ["windows-x86_64-nsis", "windows-x86_64-msi", "windows-x86_64"],
            },
            {
              name: "Linux x64",
              keys: ["linux-x86_64-appimage", "linux-x86_64-deb", "linux-x86_64"],
            },
          ];

          const missing = required.filter((item) =>
            item.keys.every((key) => !platforms[key]),
          );
          if (missing.length > 0) {
            console.error(
              `latest.json is missing updater platforms: ${missing
                .map((item) => item.name)
                .join(", ")}`,
            );
            console.error(`Found platforms: ${platformKeys.sort().join(", ")}`);
            process.exit(1);
          }

          const incomplete = platformKeys.filter((key) => {
            const platform = platforms[key];
            return !platform?.url || !platform?.signature;
          });
          if (incomplete.length > 0) {
            console.error(
              `latest.json has platforms without url/signature: ${incomplete.join(
                ", ",
              )}`,
            );
            process.exit(1);
          }

          console.log(`Validated updater platforms: ${platformKeys.sort().join(", ")}`);
          NODE

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-info.outputs.version }}
        run: |
          gh release edit "v${VERSION}" --draft=false
