name: Release packages

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-info:
    name: Release info
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release-info.outputs.version }}
      should_release: ${{ steps.release-info.outputs.should_release }}
      release_body: ${{ steps.release-info.outputs.release_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate release notes
        id: release-info
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          # A tag may exist while its draft release is still unpublished after a
          # failed publish. Only a published release means this version is done.
          PUBLISHED="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" \
            --jq '.draft == false' 2>/dev/null || true)"
          if [ "$PUBLISHED" = "true" ]; then
            {
              echo "version=${VERSION}"
              echo "should_release=false"
              echo "release_body<<EOF"
              echo "Version v${VERSION} has already been released. Release build skipped."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_TAG="$(git tag --list 'v[0-9]*' --sort=-v:refname \
            | grep -vx "v${VERSION}" | head -n 1 || true)"

          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..HEAD"
            HEADER="Changes since ${PREVIOUS_TAG}"
          else
            RANGE="HEAD"
            HEADER="Initial release"
          fi

          # 发布说明与 latest.json 保留原始提交，筛选与前缀格式化由客户端展示层处理。
          NOTES="$(git log "$RANGE" --pretty=format:'- %s (%h)' --no-merges)"
          if [ -z "$NOTES" ]; then
            NOTES="- No additional release notes."
          fi

          {
            echo "version=${VERSION}"
            echo "should_release=true"
            echo "release_body<<EOF"
            echo "${HEADER}"
            echo
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  draft-release:
    name: Prepare draft release
    needs: release-info
    if: needs.release-info.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Create or reuse draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-info.outputs.version }}
          RELEASE_BODY: ${{ needs.release-info.outputs.release_body }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          # A failed earlier run may have left a draft for this version. Reuse it
          # so retried builds replace assets instead of creating a second draft.
          # Draft releases created before the tag exists use an untagged-*
          # placeholder, so match the release name as well as the tag.
          # Capture first: piping into head could SIGPIPE gh under pipefail.
          IDS="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq "sort_by(.created_at) | reverse | .[] | select(.draft) | select(.tag_name == \"${TAG}\" or .name == \"mftp ${TAG}\") | .id")"
          ID="$(printf '%s\n' "$IDS" | head -n 1)"
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${ID}" \
              -f target_commitish="$GITHUB_SHA" -f body="$RELEASE_BODY" --silent
          else
            ID="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" -f name="mftp ${TAG}" -f body="$RELEASE_BODY" \
              -f target_commitish="$GITHUB_SHA" -F draft=true -F prerelease=false \
              --jq .id)"
          fi
          echo "release_id=${ID}" >> "$GITHUB_OUTPUT"

  ci:
    name: Wait for CI
    needs: release-info
    if: needs.release-info.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    steps:
      # CI already runs the full checks on every push to main; reuse its result
      # instead of testing the same commit again.
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$GITHUB_SHA" --event push --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "No CI run found for ${GITHUB_SHA}."
            exit 1
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          echo "Waiting for ${RUN_URL}"
          if ! gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30 >/dev/null; then
            echo "CI did not succeed: ${RUN_URL}"
            exit 1
          fi

      # A code failure invalidates every platform build; stop them early.
      - name: Cancel release run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY"

  build:
    name: Build ${{ matrix.platform }}
    # Runs alongside CI; publish waits for both, so the draft stays private
    # if CI fails.
    needs: [release-info, draft-release]
    if: needs.release-info.outputs.should_release == 'true'
    runs-on: ${{ matrix.platform }}
    strategy:
      # A platform failure keeps the others running so their assets and caches
      # survive; "Re-run failed jobs" then rebuilds only the failed platform.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --bundles app,dmg
          - platform: windows-latest
            args: --bundles nsis,msi
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache translation engine source
        uses: actions/cache@v4
        with:
          path: src-tauri/target/translation-source
          key: translation-source-${{ runner.os }}-${{ hashFiles('src-tauri/native/translation/engine.json', 'src-tauri/native/translation/legacy-stq.patch') }}

      - name: Prepare pinned translation engine source
        run: pnpm translation:prepare

      - name: Check version consistency
        run: pnpm run version:check

      - name: Check updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is required to build signed updater artifacts."
            exit 1
          fi

      - name: Build and upload Tauri package
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft-release.outputs.release_id }}
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  android:
    name: Build Android arm64-v8a
    # Uploads to the draft created up front, so it no longer waits for desktop.
    needs: [release-info, draft-release]
    if: needs.release-info.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
            src-tauri/gen/android/*.gradle.kts
            src-tauri/plugins/*/android/build.gradle.kts
            src-tauri/Cargo.lock

      - name: Setup Android SDK and NDK
        shell: bash
        run: |
          NDK_VERSION="27.0.12077973"
          BUILD_TOOLS_VERSION="36.0.0"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"
          {
            echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache translation engine source
        uses: actions/cache@v4
        with:
          path: src-tauri/target/translation-source
          key: translation-source-${{ runner.os }}-${{ hashFiles('src-tauri/native/translation/engine.json', 'src-tauri/native/translation/legacy-stq.patch') }}

      - name: Prepare pinned translation engine source
        run: pnpm translation:prepare

      - name: Write release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required to build a signed release APK."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mftp-release.jks"
          cat > src-tauri/gen/android/keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/mftp-release.jks
          keyAlias=$ANDROID_KEY_ALIAS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS

      - name: Build arm64-v8a release APK
        shell: bash
        run: |
          # NDK r23+ ships llvm-* tools only, but vendored OpenSSL (ssh2) still
          # invokes <triple>-ranlib/<triple>-ar; same shims as scripts/android.sh.
          TOOLCHAIN_BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SHIM_DIR="$PWD/src-tauri/target/.ndk-shims"
          mkdir -p "$SHIM_DIR"
          for triple in aarch64-linux-android arm-linux-androideabi armv7a-linux-androideabi i686-linux-android x86_64-linux-android; do
            ln -sf "$TOOLCHAIN_BIN/llvm-ranlib" "$SHIM_DIR/$triple-ranlib"
            ln -sf "$TOOLCHAIN_BIN/llvm-ar" "$SHIM_DIR/$triple-ar"
          done
          export PATH="$SHIM_DIR:$TOOLCHAIN_BIN:$PATH"
          pnpm tauri android build --target aarch64 --split-per-abi --apk

      - name: Upload APK to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft-release.outputs.release_id }}
          VERSION: ${{ needs.release-info.outputs.version }}
        run: |
          set -euo pipefail
          APK="src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk"
          if [ ! -f "$APK" ]; then
            echo "Expected signed APK not found at $APK"
            ls -R src-tauri/gen/android/app/build/outputs/apk || true
            exit 1
          fi
          NAME="mftp_${VERSION}_arm64-v8a.apk"
          cp "$APK" "$NAME"
          # Draft releases have no resolvable tag yet, so address the release by
          # id and delete an existing asset to keep retries idempotent.
          # Capture first: piping gh into head could SIGPIPE under pipefail.
          ASSET_IDS="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate \
            --jq ".[] | select(.name == \"${NAME}\") | .id")"
          ASSET_ID="$(printf '%s\n' "$ASSET_IDS" | head -n 1)"
          if [ -n "$ASSET_ID" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" --silent
          fi
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${NAME}" \
            -H "Content-Type: application/octet-stream" --input "$NAME" --silent

  publish:
    name: Publish release
    # CI gates publication only; builds already ran in parallel with it.
    needs: [release-info, draft-release, ci, build, android]
    if: needs.release-info.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare and validate updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft-release.outputs.release_id }}
          VERSION: ${{ needs.release-info.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/mftp-release
          # The draft has no tag yet, so fetch its assets and metadata by id.
          ASSET_IDS="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate \
            --jq '.[] | select(.name == "latest.json") | .id')"
          ASSET_ID="$(printf '%s\n' "$ASSET_IDS" | head -n 1)"
          if [ -z "$ASSET_ID" ]; then
            echo "latest.json is missing from the draft release"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            -H "Accept: application/octet-stream" > /tmp/mftp-release/latest.json
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            > /tmp/mftp-release/release.json

          node <<'NODE'
          const fs = require("fs");

          const manifestPath = "/tmp/mftp-release/latest.json";
          const manifest = JSON.parse(
            fs.readFileSync(manifestPath, "utf8"),
          );
          const release = JSON.parse(
            fs.readFileSync("/tmp/mftp-release/release.json", "utf8"),
          );
          const version = process.env.VERSION;
          if (
            manifest.version !== version ||
            release.name !== `mftp v${version}` ||
            !release.draft
          ) {
            throw new Error("Updater manifest and release versions do not match");
          }
          const platforms = manifest.platforms ?? {};
          const platformKeys = Object.keys(platforms);
          const required = [
            {
              name: "macOS Apple Silicon",
              keys: ["darwin-aarch64-app", "darwin-aarch64"],
            },
            {
              name: "Windows x64",
              keys: ["windows-x86_64-nsis", "windows-x86_64-msi", "windows-x86_64"],
            },
            {
              name: "Linux x64",
              keys: ["linux-x86_64-appimage", "linux-x86_64-deb", "linux-x86_64"],
            },
          ];

          const missing = required.filter((item) =>
            item.keys.every((key) => !platforms[key]),
          );
          if (missing.length > 0) {
            console.error(
              `latest.json is missing updater platforms: ${missing
                .map((item) => item.name)
                .join(", ")}`,
            );
            console.error(`Found platforms: ${platformKeys.sort().join(", ")}`);
            process.exit(1);
          }

          const incomplete = platformKeys.filter((key) => {
            const platform = platforms[key];
            return !platform?.url || !platform?.signature;
          });
          if (incomplete.length > 0) {
            console.error(
              `latest.json has platforms without url/signature: ${incomplete.join(
                ", ",
              )}`,
            );
            process.exit(1);
          }

          // Public updates must not consume GitHub's unauthenticated API quota.
          // Resolve against this release's assets to preserve the signed artifact.
          const downloadPrefix = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/releases/download/v${version}/`;
          for (const [key, platform] of Object.entries(platforms)) {
            const asset = release.assets.find(
              (asset) =>
                asset.url === platform.url ||
                asset.browser_download_url === platform.url ||
                platform.url.endsWith(`/${asset.name}`),
            );
            if (!asset || asset.size <= 0) {
              throw new Error(`Updater platform ${key} does not reference an asset in this release`);
            }
            // Draft assets use an untagged placeholder URL; publish with the
            // final version tag so clients download from the stable path.
            platform.url = `${downloadPrefix}${encodeURIComponent(asset.name)}`;
          }

          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(`Validated updater platforms: ${platformKeys.sort().join(", ")}`);
          NODE

          ASSET_IDS="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate \
            --jq '.[] | select(.name == "latest.json") | .id')"
          ASSET_ID="$(printf '%s\n' "$ASSET_IDS" | head -n 1)"
          if [ -n "$ASSET_ID" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" --silent
          fi
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=latest.json" \
            -H "Content-Type: application/json" --input /tmp/mftp-release/latest.json --silent

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft-release.outputs.release_id }}
          VERSION: ${{ needs.release-info.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          # Drafts listed before publication carry an untagged placeholder.
          # Create the real tag and set it while publishing so the public
          # release and its asset URLs use the version tag.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA" -F force=true --silent
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="$GITHUB_SHA" --silent
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f tag_name="$TAG" -F draft=false --silent
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.tag_name'
