name: CI

on:
  pull_request:
    branches:
      - main
  push:
    # 预算、体积这类阈值回归只有合进 main 才会暴露：PR 常卡在更早的步骤。
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# CI builds only need line info for panics; full debug info slows linking and
# bloats the Rust cache. Local dev builds keep their defaults.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check React version consistency
        run: pnpm run check:react

      - name: Check model offline resources
        run: pnpm run check:model-offline

      - name: Check form error semantics
        run: pnpm run check:form-errors

      - name: Check application version consistency
        run: pnpm run version:check

      - name: Lint frontend
        run: pnpm run lint

      - name: Check platform packaging rules
        run: pnpm run check:platform

      - name: Build frontend
        run: pnpm run build

      - name: Check build size and lazy preload budgets
        run: pnpm run check:build-budget

      - name: Build other frontend targets
        run: |
          pnpm build --platform macos
          pnpm build --platform windows
          pnpm build --platform android
          pnpm build --platform ios

      - name: Run frontend tests
        run: pnpm test

  rust:
    name: Rust checks and tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          # PRs restore main's cache but never evict it with their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache translation engine source
        uses: actions/cache@v6
        with:
          path: src-tauri/target/translation-source
          key: translation-source-${{ runner.os }}-${{ hashFiles('src-tauri/native/translation/engine.json', 'src-tauri/native/translation/legacy-stq.patch') }}

      - name: Prepare pinned translation engine source
        run: pnpm translation:prepare

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # Tauri embeds the frontend at compile time, so dist must exist first.
      - name: Build frontend
        run: pnpm run build

      - name: Lint Rust library
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --lib -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Check generated IPC bindings
        run: git diff --exit-code -- src/bindings.ts

  apple-check:
    name: macOS library and iOS plugins (compile only)
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust and iOS simulator target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: apple-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache translation engine source
        uses: actions/cache@v6
        with:
          path: src-tauri/target/translation-source
          key: translation-source-${{ runner.os }}-${{ hashFiles('src-tauri/native/translation/engine.json', 'src-tauri/native/translation/legacy-stq.patch') }}

      - name: Prepare pinned translation engine source
        run: pnpm translation:prepare

      - name: Build frontend resources
        run: pnpm run build

      - name: Check macOS library
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --lib

      # These build Rust/Swift adapters only; they do not launch a simulator
      # or validate the complete iOS application or native system behavior.
      - name: Check iOS library
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --lib --target aarch64-apple-ios-sim

      - name: Compile iOS export and viewer plugins
        run: >-
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          -p tauri-plugin-native-export -p tauri-plugin-native-viewer
          --target aarch64-apple-ios-sim

  android-plugins:
    name: Android plugins (compile only)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
            src-tauri/gen/android/*.gradle.kts
            src-tauri/plugins/*/android/build.gradle.kts
            src-tauri/Cargo.lock

      - name: Setup Rust for locked dependency metadata
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # The Node script has no frontend dependencies. It copies the exact locked
      # Tauri API and plugins into a fresh workspace; no app/device is launched.
      - name: Assemble isolated Android plugin libraries
        env:
          TMPDIR: ${{ runner.temp }}
        run: pnpm run check:android-plugins

      - name: Preserve source and environment report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-plugin-check-report
          path: ${{ runner.temp }}/mftp-android-plugins-*/check-report.json
          if-no-files-found: warn
