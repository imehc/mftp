[package]
name = "mftp"
version = "0.2.7"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mftp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
zeroize = "1.9"
tokio = { version = "1", features = ["test-util"] }
png = "0.18"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dev-dependencies]
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "client", "base64", "transport-streamable-http-client-reqwest"] }

[dependencies]
mftp-translation-engine = { path = "native/translation" }
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
argon2 = "0.6"
chacha20poly1305 = "0.11"
dirs = "7"
parking_lot = "0.12"
walkdir = "2"
tar = "0.4"
flate2 = "1"
tauri-plugin-process = "2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
sha2 = "0.11"
local-ip-address = "0.6.13"
whoami = { version = "2", default-features = false }
fs2 = "0.4.3"
mdns-sd = "=0.21.5"
tauri-specta = { version = "=2.0.0-rc.24", features = ["typescript"] }
specta = { version = "=2.0.0-rc.24", features = ["derive"] }
specta-typescript = "=0.0.11"

# Only to build the session's fallback tracker list; must stay on the same
# major as librqbit's own url dep so HashSet<Url> matches.
url = { version = "2", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "gzip", "rustls", "stream"] }
eventsource-stream = "0.2.3"
futures-util = "0.3"
# Shared maintenance/AI use notifications, deadlines and select! on Tauri's runtime;
# BT-specific networking and file IO features remain platform-scoped below.
tokio = { version = "1", features = ["macros", "sync", "time"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tauri-plugin-clipboard-manager = "2.2.2"
zeroize = "1.9"

# Desktop-only plugins: updater, autostart and window-state have no mobile support.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "base64", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body = "1"
tokio-util = "0.7"
getrandom = "0.4"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2.5.1"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-window-state = "2"
# Library sync uses the GitHub tree/blob API on desktop and mobile. The desktop
# tar.gz path remains a fallback, so reqwest is a shared direct dependency.

# BT is exposed on desktop and Android. librqbit's socket layer uses APIs
# unavailable on iOS, so the engine dependencies stay out of iOS builds.
[target.'cfg(not(target_os = "ios"))'.dependencies]
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
librqbit-core = { version = "9.0.1", default-features = false, features = ["sha1-ring"] }
tokio = { version = "1", features = ["net", "io-util"] }
anyhow = "1"
mime_guess = "2"

[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["AVAudioSessionTypes"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIApplication"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-native-speech = { path = "plugins/native-speech" }
tauri-plugin-android-updater = { path = "plugins/android-updater" }
tauri-plugin-keystore = "=2.1.0-alpha.2"
jni = "0.22"
rustls-platform-verifier = "0.7.1"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVSpeechSynthesis"] }
objc2-foundation = "0.3"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-native-viewer = { path = "plugins/native-viewer" }
tauri-plugin-native-export = { path = "plugins/native-export" }

# Smaller release binaries without slowing builds. LTO and codegen-units = 1
# cut a little more but roughly tripled release compile time.
[profile.release]
strip = true
