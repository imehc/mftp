[package]
name = "mftp"
version = "0.1.10"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mftp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
argon2 = "0.5"
chacha20poly1305 = "0.10"
dirs = "6"
parking_lot = "0.12"
walkdir = "2"
tar = "0.4"
flate2 = "1"
tauri-plugin-process = "2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
local-ip-address = "0.6.13"
whoami = { version = "2", default-features = false }
fs2 = "0.4.3"
mdns-sd = "=0.20.3"
tauri-specta = { version = "=2.0.0-rc.24", features = ["typescript"] }
specta = { version = "=2.0.0-rc.24", features = ["derive"] }
specta-typescript = "=0.0.11"

# Desktop-only plugins: updater and autostart have no mobile support.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2.5.1"
