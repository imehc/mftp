<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>HDR 恢复验证</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <pre id="result">运行中</pre>
    <script type="module">
      import { Scene, WebGLRenderer } from "three";
      import { commands } from "/src/bindings.ts";
      import { ViewerEnvironment } from "/src/features/model-viewer/inspection/environment.ts";
      window.__TAURI__ = {};
      let saved = null,
        draft = null,
        commits = 0,
        clears = 0;
      const ok = (data) => ({ status: "ok", data });
      commands.modelEnvironmentBegin = async (name, size) => {
        draft = { id: "isolated", name, size, bytes: [] };
        return ok(draft.id);
      };
      commands.modelEnvironmentWrite = async (id, offset, bytes) => {
        if (id !== draft.id || offset !== draft.bytes.length)
          throw new Error("bad chunk");
        draft.bytes.push(...bytes);
        return ok(null);
      };
      commands.modelEnvironmentCommit = async () => {
        saved = draft;
        draft = null;
        commits++;
        return ok(null);
      };
      commands.modelEnvironmentCurrent = async () =>
        ok(saved && { id: saved.id, name: saved.name, size: saved.size });
      commands.modelEnvironmentRead = async () => ok(saved.bytes);
      commands.modelEnvironmentAbort = async () => {
        draft = null;
        return ok(null);
      };
      commands.modelEnvironmentClear = async () => {
        saved = null;
        clears++;
        return ok(null);
      };
      const renderer = new WebGLRenderer({
        canvas: document.getElementById("canvas"),
      });
      renderer.setSize(320, 200);
      const header = new TextEncoder().encode(
        "#?RADIANCE\nFORMAT=32-bit_rle_rgbe\n\n-Y 1 +X 1\n",
      );
      const bytes = new Uint8Array(header.length + 4);
      bytes.set(header);
      bytes.set([128, 64, 32, 129], header.length);
      const firstScene = new Scene();
      const first = new ViewerEnvironment(firstScene, renderer, () => {});
      try {
        await first.load(new File([bytes], "qa-light.hdr"));
        if (first.snapshot().error || first.snapshot().storageError)
          throw new Error("HDR load/save failed");
        const roundtrip =
          JSON.stringify(saved.bytes) === JSON.stringify(Array.from(bytes));
        first.dispose();
        const retained = !!saved;
        const secondScene = new Scene();
        const second = new ViewerEnvironment(secondScene, renderer, () => {});
        await second.restore();
        const state = second.snapshot();
        const restored =
          state.name === "qa-light.hdr" &&
          !!secondScene.environment &&
          !!secondScene.background &&
          !state.error;
        const commitCount = commits;
        second.clear();
        await new Promise((resolve, reject) => {
          const end = Date.now() + 5000;
          const timer = setInterval(() => {
            if (!second.snapshot().saving) {
              clearInterval(timer);
              resolve();
            } else if (Date.now() > end) {
              clearInterval(timer);
              reject(new Error("clear timed out"));
            }
          }, 20);
        });
        const cleared =
          saved === null && secondScene.environment === null && clears === 1;
        second.dispose();
        const result = {
          roundtrip,
          retained,
          restored,
          commitCount,
          cleared,
          passed:
            roundtrip && retained && restored && commitCount === 1 && cleared,
        };
        document.getElementById("result").textContent = JSON.stringify(result);
      } catch (error) {
        document.getElementById("result").textContent = JSON.stringify({
          passed: false,
          error: error.message,
        });
      } finally {
        renderer.dispose();
      }
    </script>
  </body>
</html>
