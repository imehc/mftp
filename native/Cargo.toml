[package]
name = "mftp-native"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
chrono = "0.4"
mftp-image = { path = "../crates/mftp-image" }
mftp-foundation = { path = "../crates/mftp-foundation", features = ["sqlite", "json"] }
mftp-todo = { path = "../crates/mftp-todo" }
futures-channel = "0.3"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
gpui-kit = { version = "=0.9.1", default-features = false, features = ["component", "assets"] }
gpui-kit-markdown-editor = { path = "vendor/gpui-kit-markdown-editor" }
dirs = "7"
sys-locale = "0.3"
rust-i18n = "=4.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
markdown = "=1.0.0"
url = "2"
uuid = { version = "1", features = ["v4"] }
unicode-segmentation = "1.13"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
gpui-kit-markdown-editor = { path = "vendor/gpui-kit-markdown-editor", features = ["test-support"] }
tempfile = "3"
futures = { version = "0.3", features = ["executor"] }
gpui-kit = { version = "=0.9.1", default-features = false, features = ["component", "assets", "test-support"] }

[lints]
workspace = true
